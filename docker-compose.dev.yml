services:
  mongo:
    image: mongo:8.0.16
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --host 127.0.0.1 --eval 'try { rs.status(); if (!db.hello().isWritablePrimary) quit(1) } catch (e) { if (e.code !== 94) throw e; rs.initiate({_id: \"rs0\", members: [{_id: 0, host: \"127.0.0.1:27017\"}]}); quit(1) }' "]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
volumes:
  mongo-data:
